<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Me A Tissue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal-container">
        <!-- Terminal Body Content -->
        <div class="terminal-body">
            <p class="count-display">Tissues Dispensed: <span id="tissue-count">0</span></p>

            <!-- Tissue Box & Animation Stage -->
            <div class="box-stage">
                <!-- Tissue popping out -->
                <div class="tissue" id="tissue"></div>
                <!-- Tissue Box -->
                <div class="tissue-box">
                    <div class="box-top-slot"></div>
                    <div class="box-label">TISSUES</div>
                </div>
            </div>

            <!-- Action Button -->
            <button id="dispense-btn">wanna tissue🫶🏽</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
